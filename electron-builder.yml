appId: com.andrewduval6.fieldscreen
productName: FieldScreen TV
directories:
  app: desktop
  output: release
  buildResources: desktop
files:
  - main.cjs
  - preload.cjs
  - vault.cjs
  - from: generated
    to: .
    filter:
      - iptv.cjs
  - from: generated/licenses
    to: licenses
  - icon.png
  - '!node_modules/**/*'
extraFiles:
  - from: public/preview
    to: resources/public/preview
  - from: desktop/recorder
    to: resources/recorder
    filter:
      - ffmpeg
      - '*LICENSE.txt'
      - NOTICE.txt
asar: true
compression: normal
linux:
  syncDesktopName: true
  executableName: fieldscreen-tv
  category: AudioVideo
  icon: desktop/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  artifactName: FieldScreen-TV-${version}-Linux-${arch}.${ext}
  desktop:
    entry:
      Name: FieldScreen TV
      Comment: NFL, MLB, and IPTV multiview
      StartupWMClass: fieldscreen-tv
publish: null
