name: Linux preview
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run build:recorder
      - run: npm test
      - run: npm run build
      - run: npm run package:linux
      - run: npm run verify:package
      - name: Checksums
        run: cd release && sha256sum *.AppImage *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-preview
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/SHA256SUMS
          retention-days: 14
